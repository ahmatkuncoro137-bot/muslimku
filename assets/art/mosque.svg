    <rect x="40" y="220" width="4" height="22" rx="1"/>
    <ellipse cx="78" cy="220" rx="14" ry="22"/>
    <rect x="76" y="226" width="4" height="18" rx="1"/>
    <ellipse cx="370" cy="216" rx="20" ry="30"/>
    <rect x="368" y="224" width="4" height="22" rx="1"/>
    <ellipse cx="336" cy="222" rx="13" ry="20"/>
  </g>
  <!-- left minaret -->
  <g>
    <rect x="96" y="100" width="28" height="118" fill="url(#minaret)"/>
    <rect x="90" y="148" width="40" height="10" rx="1" fill="#efe6c8"/>
    <rect x="90" y="96" width="40" height="12" rx="1" fill="#efe6c8"/>
    <polygon points="110,58 128,96 92,96" fill="url(#dome)"/>
    <rect x="107" y="46" width="6" height="16" fill="#e8d48a"/>
    <circle cx="110" cy="44" r="4" fill="#f8e7a8"/>
    <rect x="104" y="112" width="6" height="12" rx="3" fill="#0b5c3a"/>
    <rect x="110" y="132" width="6" height="12" rx="3" fill="#0b5c3a"/>
  </g>
  <!-- right minaret -->
  <g>
    <rect x="288" y="100" width="28" height="118" fill="url(#minaret)"/>
    <rect x="282" y="148" width="40" height="10" rx="1" fill="#efe6c8"/>
    <rect x="282" y="96" width="40" height="12" rx="1" fill="#efe6c8"/>
    <polygon points="302,58 320,96 284,96" fill="url(#dome)"/>
    <rect x="299" y="46" width="6" height="16" fill="#e8d48a"/>
    <circle cx="302" cy="44" r="4" fill="#f8e7a8"/>
    <rect x="296" y="112" width="6" height="12" rx="3" fill="#0b5c3a"/>
    <rect x="302" y="132" width="6" height="12" rx="3" fill="#0b5c3a"/>
  </g>
  <!-- side small domes -->
  <path d="M150 142 A28 22 0 0 1 206 142 L206 150 L150 150 Z" fill="url(#dome)"/>
  <path d="M206 142 A28 22 0 0 1 262 142 L262 150 L206 150 Z" fill="url(#dome)"/>
  <circle cx="178" cy="122" r="3" fill="#f8e7a8"/>
  <circle cx="234" cy="122" r="3" fill="#f8e7a8"/>
  <!-- main hall -->
  <rect x="138" y="150" width="136" height="70" fill="url(#wall)"/>
  <rect x="138" y="150" width="136" height="8" fill="#e8d9a0"/>
  <!-- main dome -->
  <path d="M160 150 C160 108 252 108 252 150 Z" fill="url(#dome)"/>
  <rect x="203" y="86" width="6" height="18" fill="#e8d48a"/>
  <path d="M206 74 a9 9 0 1 1 -8 5" stroke="#f8e7a8" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- arches -->
  <g fill="#0c5a3c">
    <path d="M158 220 V186 A16 18 0 0 1 190 186 V220 Z"/>
    <path d="M198 220 V178 A18 22 0 0 1 214 168 A18 22 0 0 1 230 178 V220 Z"/>
    <path d="M238 220 V186 A16 18 0 0 1 270 186 V220 Z"/>
  </g>
  <rect x="204" y="196" width="4" height="24" fill="#e8d9a0"/>
  <!-- courtyard steps -->
  <rect x="120" y="220" width="172" height="8" fill="#cbb56a"/>
  <rect x="108" y="228" width="196" height="10" fill="#b39b4e"/>
  <!-- lamps -->
  <circle cx="150" cy="200" r="3" fill="#ffe08a" opacity=".9"/>
  <circle cx="262" cy="200" r="3" fill="#ffe08a" opacity=".9"/>
