<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 260" fill="none" role="img" aria-label="Ilustrasi masjid asli Muslimku">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="260">
      <stop offset="0%" stop-color="#083525"/>
      <stop offset="55%" stop-color="#0c5a3c"/>
      <stop offset="100%" stop-color="#147a4d"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e2a0"/>
      <stop offset="45%" stop-color="#d7b652"/>
      <stop offset="100%" stop-color="#b08d2c"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9f6ee"/>
      <stop offset="100%" stop-color="#cfe6d5"/>
    </linearGradient>
    <linearGradient id="minaret" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d9eadc"/>
      <stop offset="50%" stop-color="#f4fbf6"/>
      <stop offset="100%" stop-color="#c3dcc9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#ffe9a3" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#ffe9a3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="412" height="260" fill="url(#sky)"/>
  <ellipse cx="206" cy="80" rx="150" ry="70" fill="url(#glow)"/>
  <!-- stars -->
  <g fill="#f7e7b0" opacity=".9">
    <circle cx="36" cy="28" r="1.4"/>
    <circle cx="68" cy="48" r="1.1"/>
    <circle cx="110" cy="22" r="1.6"/>
    <circle cx="148" cy="40" r="1.2"/>
    <circle cx="300" cy="26" r="1.5"/>
    <circle cx="338" cy="44" r="1.1"/>
    <circle cx="372" cy="20" r="1.4"/>
    <circle cx="390" cy="58" r="1.2"/>
    <circle cx="24" cy="72" r="1"/>
    <circle cx="250" cy="18" r="1.2"/>
  </g>
  <!-- crescent moon -->
  <path d="M338 38c8.5 0 16 6.2 17.6 14.6A16 16 0 1 1 328 38c3.2-1 6.5-1.5 10-1.5z" fill="#f8e7a8"/>
  <!-- far hills -->
  <path d="M0 200 C60 170 120 186 180 176 C250 164 300 186 412 168 L412 260 L0 260 Z" fill="#0a3d2c" opacity=".55"/>
  <path d="M0 214 C80 198 140 210 220 200 C300 190 350 208 412 198 L412 260 L0 260 Z" fill="#0a4a34"/>
  <!-- trees -->
  <g fill="#083828">
